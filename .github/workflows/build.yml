name: Build-and-Push

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build \
          -t tanmaysrivastav/crud-app:${{ github.run_number }} .

      - name: Push Image
        run: |
          docker push \
          tanmaysrivastav/crud-app:${{ github.run_number }}
