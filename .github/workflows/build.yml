name: Build-And-Push

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/crud-app:${{ github.run_number }} .

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/crud-app:${{ github.run_number }}

      - name: Update Deployment Repo
        run: |
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/Tanmay-Rish/crud_deploy.git

          cd crud_deploy

          sed -i "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/crud-app:${{ github.run_number }}|g" k8s/app-deployment.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Update image version" || echo "No changes to commit"

          git push